<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>주문방법 · 엄마수산</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <meta property="og:title" content="주문방법 · 엄마수산">
  <meta property="og:image" content="https://momsusan4390.github.io/assets/img/logo.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css?v=13">
</head>
<body data-page="order">
  <header class="site-header">
    <div class="wrap header-row">
      <a class="icon-btn" href="./" aria-label="상품 목록으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <a class="logo" href="./" aria-label="엄마수산 처음으로"><img src="../assets/img/logo.png" alt="엄마수산" width="800" height="800"></a>
      <span class="icon-btn" aria-hidden="true"></span>
    </div>
  </header>

  <main class="wrap order-page">
    <h1>주문방법</h1>
    <p class="status" id="order-status" aria-live="polite">불러오는 중…</p>
    <ol class="order-steps" id="order-steps"></ol>
    <div class="order-notes" id="order-notes"></div>

    <section class="cs" id="cs" aria-labelledby="cs-h">
      <h2 id="cs-h">고객센터</h2>
      <p id="cs-hours" hidden></p>
      <p id="cs-phone" hidden></p>
      <p id="cs-email-text" hidden></p>
      <div class="cs-actions">
        <a class="cs-btn" id="cs-email" hidden>이메일로 주문하기</a>
        <a class="cs-btn kakao" id="cs-kakao" target="_blank" rel="noopener noreferrer" hidden>카카오톡으로 주문하기</a>
        <a class="cs-btn" href="./">상품 보러 가기</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer-links" id="footer-links" hidden></p>
      <div class="footer-info" id="footer-info"></div>
      <p class="footer-copy" id="footer-copy">© 2026 엄마수산. All rights reserved.</p>
    </div>
  </footer>

  <div class="fab">
    <div class="recent-panel" id="recent-panel" hidden><div class="recent-head"><strong>최근 본 상품</strong><button type="button" id="recent-close" aria-label="닫기">✕</button></div><ul id="recent-list"></ul><p class="recent-empty" id="recent-empty"></p></div>
    <button type="button" class="fab-btn" id="fab-recent" hidden><span>최근본</span><em class="fab-count" id="recent-count" hidden></em></button>
    <a class="fab-btn kakao" id="fab-kakao" target="_blank" rel="noopener noreferrer" aria-label="카카오톡 문의" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9L6.4 20l3.6-2.3c.6.1 1.3.2 2 .2 5 0 9-3.1 9-7s-4-6.9-9-6.9z"/></svg>
      <span>문의</span>
    </a>
    <button type="button" class="fab-btn" id="fab-top" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
      <span>TOP</span>
    </button>
  </div>

  <script src="config.js?v=13"></script>
  <script src="assets/app.js?v=13"></script>
</body>
</html>
