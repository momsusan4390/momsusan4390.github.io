<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>엄마네농수산</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="updated"></p>
      <h1 id="shop-name">엄마네농수산</h1>
      <p class="intro" id="intro"></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="notices" id="notices" hidden>
      <h2>공지사항</h2>
      <ul id="notice-list"></ul>
      <button type="button" class="notice-more" id="notice-more" hidden></button>
    </section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="상품명·원산지 검색" aria-label="상품 검색">
      <div class="chips" id="chips" role="tablist" aria-label="카테고리"></div>
    </div>

    <p class="status" id="status">불러오는 중…</p>
    <div id="list"></div>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
