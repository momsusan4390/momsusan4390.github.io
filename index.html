<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>엄마수산</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:title" content="엄마수산">
  <meta property="og:image" content="assets/img/logo.png">
  <link rel="stylesheet" href="assets/style.css?v=202610212001">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1 class="logo"><img src="assets/img/logo.png?v=202610212001" alt="엄마수산" width="800" height="800"></h1>
      <p class="eyebrow" id="updated"></p>
      <p class="intro" id="intro"></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="notices" id="notices" hidden>
      <h2>공지사항</h2>
      <ul id="notice-list"></ul>
      <button type="button" class="notice-more" id="notice-more" hidden></button>
    </section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="상품명·원산지 검색" aria-label="상품 검색">
      <div class="chips" id="chips" role="tablist" aria-label="카테고리"></div>
      <div class="list-controls">
        <span class="count" id="count"></span>
        <div class="controls">
          <select id="sort" class="sort" aria-label="정렬">
            <option value="name">상품명순</option>
            <option value="new">신상품순</option>
            <option value="priceAsc">낮은가격순</option>
            <option value="priceDesc">높은가격순</option>
          </select>
          <div class="view-toggle" role="group" aria-label="보기 방식">
            <button type="button" data-view="grid" aria-label="바둑판 보기" title="바둑판 보기">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>
            </button>
            <button type="button" data-view="detail" aria-label="자세히 보기" title="자세히 보기">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="6" rx="1"/><rect x="3" y="11" width="14" height="6" rx="1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <p class="status" id="status">불러오는 중…</p>
    <div id="list"></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-info" id="footer-info"></div>
      <p class="footer-copy" id="footer-copy">© 2026 엄마수산. All rights reserved.</p>
    </div>
  </footer>

  <dialog class="detail" id="detail" aria-label="상품 상세">
    <button type="button" class="detail-close" id="detail-close" aria-label="닫기">✕</button>
    <div id="detail-body"></div>
  </dialog>

  <div class="fab">
    <div class="recent-panel" id="recent-panel" hidden>
      <div class="recent-head">
        <strong>최근 본 상품</strong>
        <button type="button" id="recent-close" aria-label="닫기">✕</button>
      </div>
      <ul id="recent-list"></ul>
      <p class="recent-empty" id="recent-empty">아직 본 상품이 없습니다.<br>상품 카드를 누르면 여기에 담깁니다.</p>
    </div>

    <button type="button" class="fab-btn" id="fab-recent" aria-label="최근 본 상품">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>최근본</span>
      <em class="fab-count" id="recent-count" hidden></em>
    </button>
    <a class="fab-btn kakao" id="fab-kakao" target="_blank" rel="noopener noreferrer" aria-label="카카오톡 문의" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9L6.4 20l3.6-2.3c.6.1 1.3.2 2 .2 5 0 9-3.1 9-7s-4-6.9-9-6.9z"/></svg>
      <span>문의</span>
    </a>
    <button type="button" class="fab-btn" id="fab-top" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
      <span>TOP</span>
    </button>
  </div>

  <script src="config.js?v=202610212001"></script>
  <script src="assets/app.js?v=202610212001"></script>
</body>
</html>
