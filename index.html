<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>엄마수산</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:title" content="엄마수산">
  <meta property="og:image" content="assets/img/logo.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1 class="logo"><img src="assets/img/logo.png" alt="엄마수산" width="800" height="800"></h1>
      <p class="eyebrow" id="updated"></p>
      <p class="intro" id="intro"></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="notices" id="notices" hidden>
      <h2>공지사항</h2>
      <ul id="notice-list"></ul>
      <button type="button" class="notice-more" id="notice-more" hidden></button>
    </section>

    <div class="toolbar">
      <input type="search" id="search" placeholder="상품명·원산지 검색" aria-label="상품 검색">
      <div class="chips" id="chips" role="tablist" aria-label="카테고리"></div>
    </div>

    <p class="status" id="status">불러오는 중…</p>
    <div id="list"></div>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
